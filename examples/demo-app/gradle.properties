# Project-wide Gradle settings.

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable Gradle caching
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true

# Configure JVM arguments
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable R8 full mode
android.enableR8.fullMode=true

# Suppress AndroidX publication warning
android.suppressUnsupportedCompileSdk=36

# Keep app installed after instrumented test runs (AGP 8.x+ uninstalls by default)
android.injected.androidTest.leaveApksInstalledAfterRun=true

# ─── SDK publishing coordinates (SINGLE SOURCE OF TRUTH) ──────────────────────
# The umbrella (otel-android-mobile) and every published sibling
# (otel-android-mobile-core, instrumentation-*) read these two properties for
# their Maven coordinates. Keeping them here — instead of hardcoded in each
# build.gradle.kts — means a release bump touches ONE place, and the version can
# never drift between the umbrella and its siblings (history: 0.1.0 vs 0.2.0,
# 0.4.1 vs 0.4.2 drifts that broke clean-.m2 CI). The publish CI job additionally
# asserts sdkVersionName == packages/react-native/package.json version == git tag
# (scripts/ci/check-version-parity.sh) so the native + npm + tag surfaces lock.
#
# groupId note: io.opentelemetry.android CANNOT ship to Maven Central (that
# namespace belongs to the OpenTelemetry project). io.github.barrysolomon is
# auto-verified by the Central Portal against GitHub account ownership — the
# zero-friction public namespace. See docs/MAVEN_CENTRAL.md.
sdkGroupId=io.github.barrysolomon
sdkVersionName=0.5.2-alpha
