/**
 * Processes otel-config.json.template by replacing environment variables.
 *
 * This runs during the build process to generate the actual otel-config.json
 * from the template, injecting secure credentials without committing them.
 */

import groovy.json.JsonSlurper
import groovy.json.JsonOutput

task processConfigTemplate {
    description = 'Processes otel-config.json.template and injects environment variables'
    group = 'build'

    doLast {
        def templateFile = file('src/release/assets/otel-config.json.template')
        def outputFile = file('src/release/assets/otel-config.json')

        if (!templateFile.exists()) {
            logger.warn("Template file not found: ${templateFile.path}")
            return
        }

        // Read template
        def templateContent = templateFile.text

        // Replace placeholders with environment variables
        def processedContent = templateContent
            .replace('${DASH0_ENDPOINT}', getDash0Endpoint())
            .replace('${DASH0_AUTH_TOKEN}', getDash0AuthToken())
            .replace('${DASH0_DATASET}', getDash0Dataset())

        // Write output
        outputFile.parentFile.mkdirs()
        outputFile.text = processedContent

        logger.lifecycle("✅ Generated otel-config.json from template")
        logger.lifecycle("   Endpoint: ${getDash0Endpoint()}")
        logger.lifecycle("   Region: ${getDash0Region()}")
        logger.lifecycle("   Dataset: ${getDash0Dataset()}")
        logger.lifecycle("   Token: ${getDash0AuthToken().isEmpty() ? '❌ NOT SET' : '✅ SET'}")
    }
}

// Hook into build process
tasks.whenTaskAdded { task ->
    if (task.name == 'preBuild') {
        task.dependsOn processConfigTemplate
    }
}
