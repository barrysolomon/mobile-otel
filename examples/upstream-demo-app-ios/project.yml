name: AstronomyShop
options:
  bundleIdPrefix: com.dash0.mobile.demo
  deploymentTarget:
    iOS: "16.0"
settings:
  SWIFT_VERSION: "5.9"
packages:
  OTelMobile:
    path: ../../otel-ios-mobile
targets:
  AstronomyShop:
    type: application
    platform: iOS
    sources:
      - path: AstronomyShop
        excludes:
          - "Info.plist"
    dependencies:
      - package: OTelMobile
        product: OTelMobileSDK
      - package: OTelMobile
        product: OTelMobileCore
      - package: OTelMobile
        product: NetworkInstrumentation
      - package: OTelMobile
        product: LifecycleInstrumentation
      - package: OTelMobile
        product: ErrorsInstrumentation
      - package: OTelMobile
        product: ScreenInstrumentation
      - package: OTelMobile
        product: FreezeInstrumentation
      - package: OTelMobile
        product: VitalsInstrumentation
    info:
      path: AstronomyShop/Info.plist
      properties:
        CFBundleDisplayName: Astronomy Shop
        UILaunchScreen:
          UIColorName: systemBackgroundColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
