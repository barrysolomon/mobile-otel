name: iOS Tests

on:
  push:
    branches: [ main, iPhone ]
  pull_request:
    branches: [ main, iPhone ]

jobs:
  ios-unit-tests:
    name: iOS SDK Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Xcode version
        run: xcodebuild -version

      - name: Swift Package Manager tests (macOS host)
        working-directory: otel-ios-mobile
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh

      - name: Build for iPhone simulator
        working-directory: otel-ios-mobile
        run: |
          xcodebuild build \
            -scheme OTelMobile-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            | tail -40

      - name: Run SDK tests on iPhone simulator
        working-directory: otel-ios-mobile
        run: |
          xcodebuild test \
            -scheme OTelMobile-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            | tail -60

      - name: Install xcodegen
        run: brew install --quiet xcodegen

      - name: Build Astronomy Shop demo app
        working-directory: examples/upstream-demo-app-ios
        run: |
          xcodegen generate
          xcodebuild build \
            -scheme AstronomyShop \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath ./build \
            | tail -20

  ios-safety-audit:
    name: SDK Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Grep for forbidden patterns in iOS SDK source
        run: |
          set -e
          if grep -rn "fatalError\|preconditionFailure" otel-ios-mobile/Sources/ 2>/dev/null; then
            echo "::error::fatalError/preconditionFailure found in SDK source (see docs/SDK_SAFETY.md)"
            exit 1
          fi
          if grep -rn "try!" otel-ios-mobile/Sources/ 2>/dev/null; then
            echo "::error::try! found in SDK source — use try? or do-catch"
            exit 1
          fi
          if grep -rn "Thread.sleep" otel-ios-mobile/Sources/ 2>/dev/null; then
            echo "::error::Thread.sleep found in SDK source — use Task.sleep(nanoseconds:)"
            exit 1
          fi
          UNSAFE=$(grep -rn "as!" otel-ios-mobile/Sources/ | grep -v "// safe" || true)
          if [ -n "$UNSAFE" ]; then
            echo "::warning::as! casts found — each must have a safe fallback"
            echo "$UNSAFE"
          fi
          echo "Safety audit passed."
