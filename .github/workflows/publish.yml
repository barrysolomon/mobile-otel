name: Publish packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    name: Publish @barrysolomon/mobile-react-native to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish to npm under the correct dist-tag
        # Prereleases (-alpha/-beta/-rc) MUST go to a matching dist-tag, NEVER
        # 'latest' — otherwise a plain `npm install @barrysolomon/mobile-react-native`
        # pulls a prerelease. (That is how `latest` previously ended up pinned to
        # 0.1.0-alpha.) Derive the tag from package.json's version; stable
        # versions (no prerelease suffix) publish to 'latest'.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=rc ;;
            *)        TAG=latest ;;
          esac
          echo "Publishing $VERSION to dist-tag '$TAG'"
          npm publish --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-android:
    name: Publish Android SDK to GitHub Packages Maven
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish ALL SDK modules to GitHub Packages
        working-directory: examples/demo-app
        # Unqualified task name → runs the "release" publication for EVERY module
        # that defines it: the umbrella (io.opentelemetry.android:mobile), mobile-core,
        # and all mobile-instrumentation-* modules (via the subprojects convention in
        # this composite build's root build.gradle.kts). Previously this only published
        # the umbrella, whose POM then referenced ~20 unpublished siblings — so no
        # consumer could resolve the tree (reported by Loper, 2026-06). The two demo
        # apps define no "release" publication, so they are skipped automatically.
        run: ./gradlew publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
