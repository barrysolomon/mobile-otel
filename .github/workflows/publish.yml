name: Publish packages

on:
  push:
    tags:
      - 'v*'

jobs:
  # A tag is not a quality signal — CI is. Refuse to publish any tag whose commit
  # does not have green CI. Without this gate, `git tag v0.x && git push --tags`
  # ships a red main to npm `latest` and Maven with zero checks.
  verify-ci-green:
    name: Verify CI is green for the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Tagged commit: $SHA"

          # ci.yml runs on every push to main — it MUST have a successful run.
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[].conclusion] | first // "missing"')
          echo "ci.yml → $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to publish: CI for $SHA is '$conclusion' (need 'success'). Tag a green commit."
            exit 1
          fi

          # ios-ci.yml is path-filtered (iOS sources only): require success when a
          # run exists; a missing run means no iOS files changed and is acceptable.
          ios=$(gh api "repos/${{ github.repository }}/actions/workflows/ios-ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[].conclusion] | first // "missing"')
          echo "ios-ci.yml → $ios"
          if [ "$ios" != "success" ] && [ "$ios" != "missing" ]; then
            echo "::error::Refusing to publish: iOS CI for $SHA is '$ios'. Tag a green commit."
            exit 1
          fi

  publish-npm:
    name: Publish @barrysolomon/mobile-react-native to npm
    runs-on: ubuntu-latest
    needs: verify-ci-green
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish to npm under the correct dist-tag
        # Dist-tag policy:
        #   * Stable versions (no prerelease suffix) publish to `latest`.
        #   * Prereleases publish to a matching channel tag (alpha/beta/rc) so a
        #     post-1.0 `npm install <pkg>` never pulls a prerelease.
        #   * PRE-1.0 EXCEPTION: while the major version is 0, EVERY release is a
        #     prerelease, so also point `latest` at it. Otherwise `latest` stays
        #     stuck at the first 0.x ever published (that is how it ended up
        #     pinned to 0.1.0-alpha) and a bare `npm install` gets the oldest
        #     version. Once a stable 1.0 ships, `latest` is owned solely by
        #     stable publishes and this exception no longer applies.
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          MAJOR="${VERSION%%.*}"
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=rc ;;
            *)        TAG=latest ;;
          esac
          echo "Publishing $PKG@$VERSION to dist-tag '$TAG'"
          npm publish --access public --tag "$TAG"
          # Pre-1.0 only: also make this the `latest` so the npm page + bare
          # install reflect the newest 0.x. (No-op for stable releases, which
          # already published to `latest` above.)
          if [ "$TAG" != "latest" ] && [ "$MAJOR" = "0" ]; then
            echo "Pre-1.0 release — also pointing 'latest' at $VERSION"
            npm dist-tag add "$PKG@$VERSION" latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-android:
    name: Publish Android SDK to GitHub Packages Maven
    runs-on: ubuntu-latest
    needs: verify-ci-green
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish ALL SDK modules to GitHub Packages
        working-directory: examples/demo-app
        # Unqualified task name → runs the "release" publication for EVERY module
        # that defines it: the umbrella (io.opentelemetry.android:mobile), mobile-core,
        # and all mobile-instrumentation-* modules (via the subprojects convention in
        # this composite build's root build.gradle.kts). Previously this only published
        # the umbrella, whose POM then referenced ~20 unpublished siblings — so no
        # consumer could resolve the tree (reported by Loper, 2026-06). The two demo
        # apps define no "release" publication, so they are skipped automatically.
        run: ./gradlew publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
