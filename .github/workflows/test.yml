name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        run: |
          cd examples/demo-app
          ./gradlew :otel-android-mobile:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: otel-android-mobile/build/reports/tests/

  go-tests:
    name: Go Tests (Collector Processor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: collector-processor/mobilepolicyprocessor/go.sum

      - name: Get dependencies
        run: |
          cd collector-processor/mobilepolicyprocessor
          go mod download

      - name: Run tests
        run: |
          cd collector-processor/mobilepolicyprocessor
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./collector-processor/mobilepolicyprocessor/coverage.txt
          flags: go
          name: go-coverage

  android-integration-tests:
    name: Android Integration Tests (API ${{ matrix.api-level }}, ${{ matrix.target }})
    runs-on: macos-13  # Intel runner - x86_64 emulators work reliably here
    # Disabled: repo is private, macOS runners bill at 10x. Re-enable when public.
    if: false
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
        target: [default]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Dash0 config
        # Sets service.version to "api33-google_apis" etc. so each matrix leg
        # appears as a distinct device profile in Dash0 traces.
        env:
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
        run: |
          mkdir -p examples/demo-app/android/src/debug/assets
          cat > examples/demo-app/android/src/debug/assets/otel-config.json <<EOF
          {
            "endpoint": "https://ingress.us-west-2.aws.dash0.com:4317",
            "auth_token": "${DASH0_AUTH_TOKEN}",
            "dataset": "otel-mobile",
            "service_name": "schedulr-android-ci",
            "service_version": "api${{ matrix.api-level }}-${{ matrix.target }}"
          }
          EOF

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd examples/demo-app && ./gradlew :android:connectedDebugAndroidTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results-api${{ matrix.api-level }}-${{ matrix.target }}
          path: examples/demo-app/android/build/reports/androidTests/

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android lint
        run: |
          cd examples/demo-app
          chmod +x ./gradlew
          ./gradlew :otel-android-mobile:lint

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: otel-android-mobile/build/reports/lint-results*.html

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Go vet
        run: |
          cd collector-processor/mobilepolicyprocessor
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: collector-processor/mobilepolicyprocessor

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android library
        run: |
          cd examples/demo-app
          chmod +x ./gradlew
          ./gradlew :otel-android-mobile:build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go processor
        run: |
          cd collector-processor/mobilepolicyprocessor
          go build ./...

      - name: Verify demo app builds
        run: |
          cd examples/demo-app
          ./gradlew :android:assembleDebug
