name: Tests

on:
  push:
    branches: [ main, develop, database-refactor-2 ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./otel-android-mobile/gradlew

      - name: Run unit tests
        run: |
          cd otel-android-mobile
          ./gradlew test --stacktrace

      - name: Generate coverage report
        run: |
          cd otel-android-mobile
          ./gradlew testDebugUnitTestCoverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: otel-android-mobile/build/reports/tests/

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./otel-android-mobile/build/reports/coverage/test/debug/report.xml
          flags: android
          name: android-coverage

  go-tests:
    name: Go Tests (Collector Processor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: collector-processor/mobilepolicyprocessor/go.sum

      - name: Get dependencies
        run: |
          cd collector-processor/mobilepolicyprocessor
          go mod download

      - name: Run tests
        run: |
          cd collector-processor/mobilepolicyprocessor
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./collector-processor/mobilepolicyprocessor/coverage.txt
          flags: go
          name: go-coverage

  android-integration-tests:
    name: Android Integration Tests
    runs-on: macos-latest
    # Only run on main branch to save CI time
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./otel-android-mobile/gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: cd otel-android-mobile && ./gradlew connectedAndroidTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-test-results
          path: otel-android-mobile/build/reports/androidTests/

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android lint
        run: |
          cd otel-android-mobile
          chmod +x ./gradlew
          ./gradlew lint

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: otel-android-mobile/build/reports/lint-results*.html

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Go vet
        run: |
          cd collector-processor/mobilepolicyprocessor
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: collector-processor/mobilepolicyprocessor

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android library
        run: |
          cd otel-android-mobile
          chmod +x ./gradlew
          ./gradlew build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go processor
        run: |
          cd collector-processor/mobilepolicyprocessor
          go build ./...

      - name: Verify demo app builds
        run: |
          cd examples/demo-app/android
          chmod +x ./gradlew
          ./gradlew assembleDebug
