name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run SDK unit tests
        run: |
          cd examples/demo-app
          ./gradlew :otel-android-mobile:testDebugUnitTest --stacktrace

      - name: Run core module tests
        run: |
          cd examples/demo-app
          ./gradlew :otel-android-mobile-core:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: otel-android-mobile/build/reports/tests/

  go-tests:
    name: Go Tests (Collector Processor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: collector-processor/mobilepolicyprocessor/go.sum

      - name: Get dependencies
        run: |
          cd collector-processor/mobilepolicyprocessor
          go mod download

      - name: Run tests
        run: |
          cd collector-processor/mobilepolicyprocessor
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./collector-processor/mobilepolicyprocessor/coverage.txt
          flags: go
          name: go-coverage


  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android lint
        run: |
          cd examples/demo-app
          chmod +x ./gradlew
          ./gradlew :otel-android-mobile:lint

      - name: Run ktlint
        working-directory: examples/demo-app
        run: ./gradlew ktlintCheck

      - name: Run ktlint (demo-app-starter)
        working-directory: examples/demo-app-starter
        run: ./gradlew ktlintCheck

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: otel-android-mobile/build/reports/lint-results*.html

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Go vet
        run: |
          cd collector-processor/mobilepolicyprocessor
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: collector-processor/mobilepolicyprocessor

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android library
        run: |
          cd examples/demo-app
          chmod +x ./gradlew
          ./gradlew :otel-android-mobile:build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Go processor
        run: |
          cd collector-processor/mobilepolicyprocessor
          go build ./...

      - name: Verify demo app builds
        run: |
          cd examples/demo-app
          ./gradlew :android:assembleDebug
