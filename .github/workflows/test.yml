name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run SDK unit tests
        run: |
          cd examples/demo-app
          ./gradlew :otel-android-mobile:testDebugUnitTest --stacktrace

      - name: Run core module tests
        run: |
          cd examples/demo-app
          ./gradlew :otel-android-mobile-core:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-results
          path: otel-android-mobile/build/reports/tests/

  go-tests:
    name: Go Tests (Collector Processor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: collector-processor/mobilepolicyprocessor/go.sum

      - name: Get dependencies
        run: |
          cd collector-processor/mobilepolicyprocessor
          go mod download

      - name: Run tests
        run: |
          cd collector-processor/mobilepolicyprocessor
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage reports
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        with:
          files: ./collector-processor/mobilepolicyprocessor/coverage.txt
          flags: go
          name: go-coverage


  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android lint
        run: |
          cd examples/demo-app
          chmod +x ./gradlew
          ./gradlew :otel-android-mobile:lint

      - name: Run ktlint
        working-directory: examples/demo-app
        run: ./gradlew ktlintCheck

      - name: Run ktlint (demo-app-starter)
        working-directory: examples/demo-app-starter
        run: ./gradlew ktlintCheck

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-lint-results
          path: otel-android-mobile/build/reports/lint-results*.html

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - name: Run Go vet
        run: |
          cd collector-processor/mobilepolicyprocessor
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest
          working-directory: collector-processor/mobilepolicyprocessor

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android library
        run: |
          cd examples/demo-app
          chmod +x ./gradlew
          ./gradlew :otel-android-mobile:build

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - name: Build Go processor
        run: |
          cd collector-processor/mobilepolicyprocessor
          go build ./...

      - name: Verify demo app builds
        run: |
          cd examples/demo-app
          ./gradlew :android:assembleDebug
