# Device tests — the suites a hosted per-push runner can't afford.
#
# ci.yml deliberately stops at unit tests + compile gates (macOS minutes bill
# 10x, emulators add ~20 min/run). The cost-driven gap that leaves — found by
# the 2026-06-11 QA audit ("signal existed but enforcement didn't") — is that
# the Android instrumented suite and the 530-test iOS simulator suite only
# ever ran on a developer's machine. This workflow closes the gap where the
# cost argument doesn't apply: nightly, on release tags, and on demand.
#
# NOT a publish gate: publish.yml's verify-ci-green checks ci.yml + ios-ci.yml
# (which run per-push). A tag triggers this workflow AND publish in parallel —
# a device-test failure here is a loud post-release signal (fix forward or
# yank the tag), not a publish blocker. Promoting it to a gate means making
# publish wait ~30 min on every tag; revisit at 1.0.
name: Device Tests

on:
  schedule:
    - cron: '17 9 * * *' # nightly, 09:17 UTC (off the top-of-hour rush)
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-instrumented:
    name: Android instrumented suite (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Start the demo backend (scenario suites book against it)
        working-directory: examples/demo-backend
        run: |
          npm ci
          cp -n .env.example .env || true
          (npx tsx src/index.ts > /tmp/demo-backend.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://localhost:3001/health && break; sleep 1; done
      - name: SDK instrumented tests on emulator (API 34)
        # The suite is self-contained: the kill-switch test runs its own local
        # HTTP server, the budget/buffer/DSL tests need no backend. Includes
        # StartupBudgetTest (HS-001, with its emulator calibration) and
        # StopThreadSafetyTest.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # google_apis, not the AOSP "default" image: EncryptedDiskBufferTest
          # provisions a Keystore-wrapped SQLCipher passphrase, and the AOSP
          # image's keymaster failed provisioning on the first real run of
          # this job (encryption silently degraded to cleartext, which the
          # test rightly refuses to accept).
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: examples/demo-app
          # NOTE: the runner executes each script line as its own `sh -c`, so
          # multi-line shell constructs must stay on one line.
          script: |
            adb logcat -c || true
            ./gradlew :otel-android-mobile:connectedDebugAndroidTest || (echo '=== SDK logcat (encryption/buffer/keystore diagnostics) ==='; adb logcat -d -s DiskLogBuffer:V DiskBufferKeyManager:V MobileLoggerProvider:V SessionManager:V AndroidKeysetManager:V keystore2:V | tail -100; exit 1)
            ./gradlew :android:connectedDebugAndroidTest || (echo '=== scenario-suite logcat ==='; adb logcat -d -s MobileLogRecordProcessor:V LoggingHttpExporter:V | tail -60; exit 1)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-results
          path: otel-android-mobile/build/outputs/androidTest-results/
          if-no-files-found: ignore

  ios-simulator:
    name: iOS full suite (simulator)
    runs-on: macos-15
    # 90, not 60: a COLD run (no SwiftPM cache) spends most of its time
    # compiling grpc-swift and was killed by a 60-min budget twice during
    # bring-up. Cancelled/timed-out jobs don't save caches, so a too-tight
    # budget is self-perpetuating: no run ever finishes, no cache is ever
    # seeded, every run is cold. Once one run completes, the cache makes
    # the nightly steady state far faster.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      # restore/save are SPLIT (not plain actions/cache) so the save runs
      # `if: always()` — a job killed by timeout-minutes skips the implicit
      # cache post-step but DOES run always() steps. Without this, a cold run
      # that times out saves nothing and every subsequent run is cold again
      # (the first bring-up runs proved it: 3-core macOS runners need >90 min
      # for a cold grpc-swift compile). With it, each timed-out run seeds its
      # partial build and the next one resumes incrementally until one
      # completes; from then on runs are warm and fast.
      - name: Restore SwiftPM build cache
        uses: actions/cache/restore@v5
        with:
          path: .build-xcode
          key: spm-ios-sim-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-ios-sim-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
            spm-ios-sim-${{ runner.os }}-
      - name: Run the full test suite on a simulator
        # ios-ci.yml is compile-only because `swift test` on the macOS host
        # hangs (run-loop/notification tests need the iOS environment). On a
        # simulator the full suite passes — this is where it runs in CI.
        # The simulator name is resolved dynamically so Xcode image bumps on
        # the runner don't break the job.
        #
        # Runs at the repo root: Package.swift moved there in #54 (SwiftPM
        # tooling walks up to find it, xcodebuild does NOT — running from
        # otel-ios-mobile/ fails with "does not contain an Xcode project").
        run: |
          set -euo pipefail
          SIM_NAME=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/ \(.*$//' | xargs)
          if [ -z "$SIM_NAME" ]; then
            echo "::error::No available iPhone simulator on this runner"; exit 1
          fi
          echo "Using simulator: $SIM_NAME"
          xcodebuild test \
            -scheme OTelMobile-Package \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath .build-xcode \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Save SwiftPM build cache (even on timeout)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .build-xcode
          # run-id suffix: cache keys are immutable, and the restore above
          # falls back by prefix — each run saves its own (more complete)
          # snapshot and the next run restores the newest matching prefix.
          key: spm-ios-sim-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ github.run_id }}
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: TestResults.xcresult
          if-no-files-found: ignore
