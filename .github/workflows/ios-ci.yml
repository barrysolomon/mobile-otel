name: iOS CI
# macOS runners bill at ~10x ubuntu, so this workflow is deliberately frugal:
#   - NO iOS Simulator / xcodebuild. Jobs run `swift test` on the macOS host
#     (no simulator boot). UIKit/simulator-only tests (screenshot/wireframe
#     pixel capture, gated `#if canImport(UIKit) && os(iOS)`) compile out on the
#     host and are validated locally via `otel-ios-mobile/run-tests.sh` or a
#     manual full run — they must NOT run in CI (simulators burn quota fast).
#   - path-filtered: only runs when iOS / RN-iOS sources change.
#   - NO nightly schedule (a daily macOS run is pure quota burn with no push).
#   - SwiftPM .build is cached (keyed on Package.resolved) so heavy deps like
#     grpc-swift compile once, not every run — the dominant cost.
#   - concurrency-cancelled so rapid pushes don't stack macOS minutes.
#   - workflow_dispatch for an on-demand run.
on:
  push:
    branches: [main]
    paths:
      - 'otel-ios-mobile/**'
      - 'packages/react-native/ios/**'
      - 'packages/react-native/Package.swift'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'otel-ios-mobile/**'
      - 'packages/react-native/ios/**'
      - 'packages/react-native/Package.swift'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sdk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          # Package.swift lives at the repo ROOT since #54, so SwiftPM writes
          # .build (and reads Package.resolved) there — caching the old
          # otel-ios-mobile/ paths captured nothing and every run was cold.
          path: .build
          key: spm-ios-sdk-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-ios-sdk-${{ runner.os }}-
      - name: iOS SDK compile gate (host, no simulator)
        # Compile-only on purpose, and library-only (not --build-tests):
        #   * `swift test` on the macOS HOST hangs on this suite — some tests
        #     need the iOS run-loop/notification environment and never complete
        #     off-simulator (they pass on a simulator). A simulator in CI is the
        #     10x-quota burn we're avoiding.
        #   * `--build-tests` would compile the test targets, but those
        #     `import Testing` (swift-testing), which only resolves under the
        #     Xcode toolchain and is fragile in CLI SwiftPM.
        # So CI is a library compile gate — it catches the high-value breakage
        # (e.g. the transport/SDK compile bugs found this engagement). The full
        # 530-test suite is validated on a simulator locally via
        # `otel-ios-mobile/run-tests.sh` or a manual run; the RN bridge's logic
        # tests run host-side in the react-native-ios job below.
        working-directory: otel-ios-mobile
        run: swift build
      - name: Build test bundle (unclamped — llbuild deadlocks under strict pool)
        # The executor-starvation guard below runs the tests with
        # LIBDISPATCH_COOPERATIVE_POOL_STRICT=1. That clamp applies to the WHOLE
        # process, and `swift test`'s build phase is driven by llbuild
        # (libdispatch-backed), which DEADLOCKS under the clamp on low-core CI
        # runners BEFORE any test runs — root-caused via a thread sample in #66:
        # swift-package stuck in BuildEngineImpl::build → condition_variable::wait,
        # no compiler subprocess, no test binary. `swift test --skip-build` does
        # NOT help: its driver still re-plans the build through llbuild and hangs
        # the same way. So compile the test bundle here, UNCLAMPED; the guard
        # step then runs the already-built bundle directly, no build driver.
        run: swift build --build-tests
      - name: Executor-starvation guard (strict cooperative pool, issue #66)
        # Runs the buffering/policy suites with the Swift cooperative-executor
        # pool held to its strict width (LIBDISPATCH_COOPERATIVE_POOL_STRICT=1):
        # the pool cannot spawn overflow threads to rescue a blocked cooperative
        # thread, so any SDK path that parks one while awaiting other executor
        # work — the deadlock class that froze the nightly simulator lane in
        # issue #66 — hangs. We invoke `swiftpm-testing-helper` on the
        # ALREADY-BUILT .xctest bundle directly (the same helper `swift test`
        # uses to host swift-testing tests), so NO build driver runs under the
        # clamp — only test execution, which is exactly what the guard must
        # exercise. MobileLogRecordProcessorStarvationTests deterministically
        # saturates the pool (activeProcessorCount+2 spinners), so this catches
        # regressions regardless of runner core count. The watchdog turns a real
        # hang into a named failure instead of an opaque job timeout. Filtered to
        # suites proven to run host-side (the full suite includes run-loop /
        # notification tests that legitimately need a simulator — see the
        # compile-gate comment above).
        run: |
          set -uo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          BUNDLE="$(find "$BIN_PATH" -maxdepth 1 -name '*PackageTests.xctest' | head -1)"
          if [ -z "$BUNDLE" ]; then
            echo "::error::test bundle (*PackageTests.xctest) not found in $BIN_PATH"
            exit 1
          fi
          MACHO="$BUNDLE/Contents/MacOS/$(basename "$BUNDLE" .xctest)"
          # swiftpm-testing-helper lives beside `swift` in the toolchain; it is
          # what `swift test` execs to dlopen the bundle and run swift-testing.
          HELPER="$(dirname "$(dirname "$(xcrun --find swift)")")/libexec/swift/pm/swiftpm-testing-helper"
          # The bundle links Testing.framework via @rpath; point dyld at the
          # platform framework dir so the helper can dlopen it.
          FWPATH="$(xcrun --sdk macosx --show-sdk-platform-path)/Developer/Library/Frameworks"
          FILTER='OfflineReconnection|NetworkRestoredFlush|TtlEvictionStress|MobileLogRecordProcessor|PolicyPipelineIntegration|ErrorCoalescer|OfflinePolicy|EndToEndSmoke'
          echo "bundle=$BUNDLE"
          echo "helper=$HELPER"
          LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 \
          DYLD_FRAMEWORK_PATH="$FWPATH" DYLD_LIBRARY_PATH="$FWPATH" \
            "$HELPER" --test-bundle-path "$MACHO" \
              --testing-library swift-testing --filter "$FILTER" &
          pid=$!
          for _ in $(seq 1 600); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo '::error::Executor-starvation guard timed out — a test parked a cooperative-executor thread (deadlock class of issue #66)'
            kill -9 "$pid"
            exit 1
          fi
          wait "$pid"

  react-native-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: packages/react-native/.build
          key: spm-rn-ios-${{ runner.os }}-${{ hashFiles('packages/react-native/Package.resolved') }}
          restore-keys: spm-rn-ios-${{ runner.os }}-
      - name: RN package Swift build + tests (host, no simulator)
        working-directory: packages/react-native
        run: |
          swift build
          swift test
