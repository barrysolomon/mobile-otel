name: iOS CI
# macOS runners bill at ~10x ubuntu, so this workflow is deliberately frugal:
#   - NO iOS Simulator / xcodebuild. Jobs run `swift test` on the macOS host
#     (no simulator boot). UIKit/simulator-only tests (screenshot/wireframe
#     pixel capture, gated `#if canImport(UIKit) && os(iOS)`) compile out on the
#     host and are validated locally via `otel-ios-mobile/run-tests.sh` or a
#     manual full run — they must NOT run in CI (simulators burn quota fast).
#   - path-filtered: only runs when iOS / RN-iOS sources change.
#   - NO nightly schedule (a daily macOS run is pure quota burn with no push).
#   - SwiftPM .build is cached (keyed on Package.resolved) so heavy deps like
#     grpc-swift compile once, not every run — the dominant cost.
#   - concurrency-cancelled so rapid pushes don't stack macOS minutes.
#   - workflow_dispatch for an on-demand run.
on:
  push:
    branches: [main]
    paths:
      - 'otel-ios-mobile/**'
      - 'packages/react-native/ios/**'
      - 'packages/react-native/Package.swift'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'otel-ios-mobile/**'
      - 'packages/react-native/ios/**'
      - 'packages/react-native/Package.swift'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sdk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          # Package.swift lives at the repo ROOT since #54, so SwiftPM writes
          # .build (and reads Package.resolved) there — caching the old
          # otel-ios-mobile/ paths captured nothing and every run was cold.
          path: .build
          key: spm-ios-sdk-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-ios-sdk-${{ runner.os }}-
      - name: iOS SDK compile gate (host, no simulator)
        # Compile-only on purpose, and library-only (not --build-tests):
        #   * `swift test` on the macOS HOST hangs on this suite — some tests
        #     need the iOS run-loop/notification environment and never complete
        #     off-simulator (they pass on a simulator). A simulator in CI is the
        #     10x-quota burn we're avoiding.
        #   * `--build-tests` would compile the test targets, but those
        #     `import Testing` (swift-testing), which only resolves under the
        #     Xcode toolchain and is fragile in CLI SwiftPM.
        # So CI is a library compile gate — it catches the high-value breakage
        # (e.g. the transport/SDK compile bugs found this engagement). The full
        # 530-test suite is validated on a simulator locally via
        # `otel-ios-mobile/run-tests.sh` or a manual run; the RN bridge's logic
        # tests run host-side in the react-native-ios job below.
        working-directory: otel-ios-mobile
        run: swift build
      - name: Executor-starvation guard (strict cooperative pool, issue #66)
        # Runs the buffering/policy suites with the Swift cooperative executor
        # clamped to ONE thread (LIBDISPATCH_COOPERATIVE_POOL_STRICT=1). Any
        # code path that parks an executor thread while waiting on other
        # executor work — the deadlock class that froze the nightly simulator
        # lane in issue #66 — hangs immediately under this clamp, instead of
        # only surfacing on small CI runners under parallel-suite load. The
        # bash watchdog turns such a hang into a named failure in ~20 min
        # rather than an opaque job timeout. Filtered to suites proven to run
        # host-side: the full suite includes run-loop/notification tests that
        # legitimately need a simulator (see the compile-gate comment above).
        working-directory: otel-ios-mobile
        run: |
          set -uo pipefail
          FILTER='OfflineReconnection|NetworkRestoredFlush|TtlEvictionStress|MobileLogRecordProcessor|PolicyPipelineIntegration|ErrorCoalescer|OfflinePolicy|EndToEndSmoke'
          LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 swift test --filter "$FILTER" &
          pid=$!
          for _ in $(seq 1 1200); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo '::error::Executor-starvation guard timed out — a test parked a cooperative-executor thread (deadlock class of issue #66)'
            kill -9 "$pid"
            exit 1
          fi
          wait "$pid"

  react-native-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: packages/react-native/.build
          key: spm-rn-ios-${{ runner.os }}-${{ hashFiles('packages/react-native/Package.resolved') }}
          restore-keys: spm-rn-ios-${{ runner.os }}-
      - name: RN package Swift build + tests (host, no simulator)
        working-directory: packages/react-native
        run: |
          swift build
          swift test
