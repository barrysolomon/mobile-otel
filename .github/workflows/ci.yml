name: CI
on:
  push:
    branches: [main, iPhone, uat-matrix]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK unit tests
        working-directory: examples/demo-app
        run: |
          ./gradlew :otel-android-mobile:testDebugUnitTest \
                    :otel-android-mobile-core:testDebugUnitTest
      - name: Android lint
        working-directory: examples/demo-app
        run: ./gradlew :otel-android-mobile:lint

  go-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Go tests with race detection
        working-directory: collector-processor/mobilepolicyprocessor
        run: |
          go mod tidy
          go test -v -race ./...
      - name: Go vet
        working-directory: collector-processor/mobilepolicyprocessor
        run: go vet ./...

  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: RN package tests
        working-directory: packages/react-native
        run: |
          npm install
          npm test
          npx tsc --noEmit

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: iOS SDK tests
        working-directory: otel-ios-mobile
        run: |
          swift build
          swift test
