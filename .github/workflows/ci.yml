name: CI
# Cost-aware triggers (revised 2026-06-10):
#   - push to main/iPhone/uat-matrix and pull_request to main.
#   - `concurrency` cancels superseded runs, so the push+PR double-fire on a
#     tracked branch no longer doubles minute consumption (the earlier run is
#     cancelled the instant a newer commit arrives). This restores PR
#     validation — previously PRs ran no CI — without the quota blow-up that
#     caused the pull_request trigger to be dropped in 2026-05.
#   - The iOS (macOS, 10x-billed) job lives in ios-ci.yml, path-filtered to
#     iOS sources + run nightly, so macOS minutes are spent only when iOS
#     code actually changes.
on:
  push:
    branches: [main, iPhone, uat-matrix]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan tracked files for leaked ingest tokens / secrets
        # Dependency-free guard against committing Dash0 ingest tokens
        # (auth_…) or common private-key material. Scans only git-tracked
        # files, so local .env / .env.bak (gitignored) never trip it — but a
        # token that slips into a tracked file fails the build. Added after a
        # live ingest token was found in a gitignored demo .env (not in
        # history); this prevents the next one from reaching a tracked file.
        run: |
          set -euo pipefail
          pattern='auth_[A-Za-z0-9]{20,}|-----BEGIN ([A-Z ]+)?PRIVATE KEY-----|AKIA[0-9A-Z]{16}'
          # Exclude this workflow file (it necessarily contains the pattern string).
          if git grep -nIE "$pattern" -- . ':(exclude).github/workflows/ci.yml' > /tmp/secrets.txt; then
            echo "::error::Potential secret(s) found in tracked files:"
            cat /tmp/secrets.txt
            exit 1
          fi
          echo "No leaked secrets in tracked files."
      - name: Guard against dead Dash0 ingress hostnames
        # `ingress.dash0.com` and `ingress.us1.dash0.com` are NXDOMAIN — every
        # quick start that copy-pastes them fails at the first export. Real
        # hosts are region-scoped (e.g. ingress.us-west-2.aws.dash0.com).
        # Archival plan/spec docs under docs/superpowers/ are excluded: they
        # record history and are not adopter-facing.
        run: |
          set -euo pipefail
          pattern='ingress\.(us1\.)?dash0\.com'
          if git grep -nIE "$pattern" -- . \
              ':(exclude).github/workflows/ci.yml' \
              ':(exclude)docs/superpowers' > /tmp/dead-hosts.txt; then
            echo "::error::Dead Dash0 ingress hostname(s) found (NXDOMAIN — use region-scoped hosts like ingress.us-west-2.aws.dash0.com):"
            cat /tmp/dead-hosts.txt
            exit 1
          fi
          echo "No dead ingress hostnames in tracked files."

  version-parity:
    # Catch version drift on EVERY push — not just at tag time. The v0.5.1-alpha
    # UAT shipped three disagreeing version strings; this fails the moment npm /
    # native gradle / RN-bridge-distro diverge, long before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Assert version parity across npm / gradle / distro
        run: scripts/ci/check-version-parity.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK unit tests
        working-directory: examples/demo-app
        run: |
          ./gradlew :otel-android-mobile:testDebugUnitTest \
                    :otel-android-mobile-core:testDebugUnitTest
      - name: Android lint
        working-directory: examples/demo-app
        run: ./gradlew :otel-android-mobile:lint

  # The SDK's R8 gate: build the demo app (the reference consumer) with
  # minification ON. Proves consumer-rules.pro actually works in a minified
  # app — the most common day-1 SDK integration failure — and that the public
  # entry points survive shrinking. Build-time only; runtime smoke on a
  # minified APK needs an emulator (tracked in docs/TEST_HARDENING_PLAN.md P1).
  android-minified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: R8 minified consumer build
        working-directory: examples/demo-app
        run: ./gradlew :android:assembleRelease
      - name: Assert SDK entry points survived minification
        run: |
          set -euo pipefail
          MAPPING=examples/demo-app/android/build/outputs/mapping/release/mapping.txt
          test -f "$MAPPING" || { echo "::error::R8 mapping missing — minification did not run"; exit 1; }
          for cls in \
            io.opentelemetry.android.mobile.OTelMobile \
            io.opentelemetry.android.mobile.MobileOtel \
            io.opentelemetry.android.mobile.config.MobileConfig; do
            grep -q "^$cls -> $cls:" "$MAPPING" || {
              echo "::error::$cls was renamed/stripped by R8 — consumer-rules.pro regression"; exit 1; }
          done
          echo "Public SDK entry points survived R8 ($(grep -c 'io.opentelemetry.android.mobile' "$MAPPING") mapped SDK lines)"

  # SDK weight is a consumer-facing cost: every new transitive dependency or
  # bundled resource lands in the host app's APK. The budget gate makes AAR
  # growth a reviewed decision (raise the budget in the same PR, justified)
  # instead of a silent drift discovered by an integrator.
  aar-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build release AAR
        working-directory: examples/demo-app
        run: ./gradlew :otel-android-mobile:assembleRelease
      - name: Enforce AAR size budget
        run: ./scripts/ci/check-aar-size.sh otel-android-mobile/build/outputs/aar/otel-android-mobile-release.aar

  go-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Track go.mod instead of a hardcoded pin: setup-go@v6 sets
          # GOTOOLCHAIN=local, so a pin older than go.mod's requirement
          # hard-fails instead of silently auto-downloading a newer toolchain.
          go-version-file: collector-processor/mobilepolicyprocessor/go.mod
      - name: Go tests with race detection
        working-directory: collector-processor/mobilepolicyprocessor
        run: |
          go mod tidy
          go test -v -race ./...
      - name: Go vet
        working-directory: collector-processor/mobilepolicyprocessor
        run: go vet ./...

  symbol-upload-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/symbol-upload/go.mod
      - name: Test symbol-upload CLI
        working-directory: tools/symbol-upload
        run: go test -race ./...
      - name: Vet
        working-directory: tools/symbol-upload
        run: go vet ./...

  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: RN package tests
        working-directory: packages/react-native
        run: |
          npm install
          npm test
          npx tsc --noEmit

  # Kotlin unit tests for the RN Android native module. These were previously
  # orphaned — the module had src/test/**/*.kt but no standalone Gradle build,
  # so they only ever compiled inside a host app via RN autolinking and ran
  # NOWHERE in CI (the react-native job above is jest-only). That meant the
  # OTelNetworkInterceptor — which wraps the host app's entire OkHttp pipeline —
  # shipped without a runnable test. This job runs them on a pure JVM via the
  # standalone harness added in packages/react-native/android (settings.gradle +
  # wrapper). See OTelNetworkInterceptorTest + Dash0MobileModuleTest.
  react-native-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install Android platform 36
        # react-android 0.76 + the OTel SDK pull androidx.core 1.17.x, which
        # requires compiling against android-36 (the standalone build sets
        # compileSdk=36 in settings.gradle).
        run: sdkmanager "platforms;android-36"
      - name: Publish the native Android SDK to mavenLocal
        # io.opentelemetry.android:mobile is this repo's own artifact (source in
        # otel-android-mobile/) and is not on any public repo. The RN-android
        # harness resolves it from mavenLocal, so publish it first from the
        # demo-app composite build that includes the SDK modules.
        #
        # UNQUALIFIED publishToMavenLocal (not :otel-android-mobile:...): the
        # umbrella POM depends on mobile-core + 21 mobile-instrumentation-*
        # siblings, so publishing only the umbrella leaves those transitive deps
        # unresolvable in a clean .m2 (CI). The unqualified task publishes every
        # module that has the publication (via the subprojects convention).
        working-directory: examples/demo-app
        run: ./gradlew publishToMavenLocal
      - name: RN Android Kotlin unit tests
        working-directory: packages/react-native/android
        run: ./gradlew :testDebugUnitTest
