name: CI
# Triggers: push to main/iPhone/uat-matrix only. The pull_request trigger
# was removed 2026-05-13 because every PR on a tracked branch fired CI
# twice (push + PR), doubling minute consumption. The push run on the PR
# head commit already validates the same code.
#
# The iOS job was also removed 2026-05-13. macos-15 runners bill at 10x
# the ubuntu rate; a single failed iOS run consumed hundreds of
# ubuntu-minute equivalents. `swift test` is validated locally on every
# SDK change (407/407 green as of the architecture-hardening epic). CI
# now covers the free-tier jobs: Android JVM unit tests + Go + React Native.
on:
  push:
    branches: [main, iPhone, uat-matrix]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK unit tests
        working-directory: examples/demo-app
        run: |
          ./gradlew :otel-android-mobile:testDebugUnitTest \
                    :otel-android-mobile-core:testDebugUnitTest
      - name: Android lint
        working-directory: examples/demo-app
        run: ./gradlew :otel-android-mobile:lint

  go-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Go tests with race detection
        working-directory: collector-processor/mobilepolicyprocessor
        run: |
          go mod tidy
          go test -v -race ./...
      - name: Go vet
        working-directory: collector-processor/mobilepolicyprocessor
        run: go vet ./...

  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: RN package tests
        working-directory: packages/react-native
        run: |
          npm install
          npm test
          npx tsc --noEmit
