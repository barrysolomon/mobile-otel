# Default collector configuration for otelcol-mobile.
#
# This is the config baked into the image. Override it in production by
# mounting your own config at /app/config.yaml, or passing --config=<path>.
#
# See README.md for full configuration reference.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Mobile policy processor — annotates matching log records.
  # Policies below are examples — replace with your own.
  mobilepolicy:
    policies:
      - id: ui-freeze-alert
        enabled: true
        match:
          logical_operator: and
          attributes:
            event.name:
              equals: "ui.freeze"
            duration_ms:
              gt: 2000.0
        actions:
          - type: annotate
            parameters:
              alert: true

      - id: crash-recovery
        enabled: true
        match:
          logical_operator: and
          attributes:
            event.name:
              equals: "app.start"
            recovery_type:
              equals: "crash"
        actions:
          - type: annotate
            parameters:
              flush_window_minutes: 5

exporters:
  # Debug exporter — logs every record to stdout (use for development/testing only)
  debug:
    verbosity: detailed
    sampling_initial: 10
    sampling_thereafter: 100

  # OTLP exporter — forward to a real backend.
  # Uncomment and configure for production use.
  # otlp:
  #   endpoint: "https://your-backend.example.com:4317"
  #   headers:
  #     Authorization: "Bearer <your-token>"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, mobilepolicy]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
